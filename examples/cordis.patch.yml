# Add this top-level patch entry to the shipped DSH Web profile. The Base and
# Web bundles continue to own the native credentials, webServer, runtime, and
# Connection rows; do not replace them. In the shipped bundle that owner is
# `name: '@deepseek-ai/dsh-client-connection'`; supply `trustedHosts:` with the
# public authority through `dsh web --trusted-host`. The acceptance lane's Web
# CLI flags correspond to `host: 127.0.0.1`, `printUrl: false`, and
# `openBrowser: false` without inventing a replacement runtime row.
- insert:
    - id: senti100-oidc
      name: '@senti100/dsh-oidc'
      inject: [webServer, connection, credentials]
      config:
        issuer: !!js process.env.DSH_OIDC_ISSUER
        clientId: !!js process.env.DSH_OIDC_CLIENT_ID
        clientSecretRef: !!js process.env.DSH_OIDC_CLIENT_SECRET_REF
        publicOrigin: !!js process.env.DSH_OIDC_PUBLIC_ORIGIN
        allowedSubjects: !!js JSON.parse(process.env.DSH_OIDC_ALLOWED_SUBJECTS || '[]')
        groupMode: any
