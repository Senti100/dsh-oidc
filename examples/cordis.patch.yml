# Add this top-level patch to a separate DSH Web profile. The Base and Web
# bundles keep ownership of credentials, webServer, runtime, and Connection.
# DSH Web 0.1.5-rc.1 prints a bearer bootstrap URL by default; --no-open does
# NOT suppress it. Override the shipped `web-runtime` row before exposure.
# Connection is still owned by `@deepseek-ai/dsh-client-connection`; supply the
# public authority with `dsh --profile web-oidc --trusted-host dsh.example`.
- id: web-runtime
  config:
    printUrl: false
- insert:
    - id: senti100-oidc
      name: '@senti100/dsh-oidc'
      inject: [webServer, connection, credentials]
      config:
        issuer: !!js process.env.DSH_OIDC_ISSUER
        clientId: !!js process.env.DSH_OIDC_CLIENT_ID
        clientSecretRef: !!js process.env.DSH_OIDC_CLIENT_SECRET_REF
        publicOrigin: !!js process.env.DSH_OIDC_PUBLIC_ORIGIN
        allowedSubjects: !!js JSON.parse(process.env.DSH_OIDC_ALLOWED_SUBJECTS || '[]')
        groupMode: any
