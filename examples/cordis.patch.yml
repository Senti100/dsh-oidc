# Illustrative patch fragment, not a guaranteed complete 0.1.5-rc.1 Web profile.
# Preserve the deployment's existing rows and values; add this Host-only row.
plugins:
  group:web:
    - id: senti100-oidc
      name: '@senti100/dsh-oidc'
      inject: [webServer, connection, credentials]
      config:
        issuer: !!js process.env.DSH_OIDC_ISSUER
        clientId: !!js process.env.DSH_OIDC_CLIENT_ID
        clientSecretRef: !!js process.env.DSH_OIDC_CLIENT_SECRET_REF
        publicOrigin: !!js process.env.DSH_OIDC_PUBLIC_ORIGIN
        allowedSubjects: !!js JSON.parse(process.env.DSH_OIDC_ALLOWED_SUBJECTS || '[]')
        groupMode: any

    # Keep the native row; configure the public authority on it.
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      config:
        trustedHosts:
          !!js [new URL(process.env.DSH_OIDC_PUBLIC_ORIGIN).host, ...ctx.webRuntime.trustedHosts]

    # Illustration only. Patch replacement is whole-object: a real deployment
    # must restate its complete source-verified web-runtime configuration here.
    - id: web-runtime
      name: '@deepseek-ai/dsh-web-runtime'
      config:
        host: 127.0.0.1
        port: 3080
        printUrl: false
        openBrowser: false
