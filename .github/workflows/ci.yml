name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm audit --omit=dev --audit-level=low
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run pack:check
      - run: npm run secret:scan
      - name: Provision exact full-profile runtime and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --force corepack@0.34.0
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
          corepack pnpm --dir tests/fixtures/full-profile install --frozen-lockfile
          tests/fixtures/full-profile/node_modules/.bin/playwright install --with-deps chromium
      - name: Provision exact Caddy acceptance binary
        shell: bash
        run: |
          set -euo pipefail
          image='caddy@sha256:d8c17a862962def15cde69863a3a463f25a2664942eafd7bdbf050e9c3116b83'
          docker pull "$image"
          container="$(docker create "$image")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          chmod 0755 "$RUNNER_TEMP/caddy"
          "$RUNNER_TEMP/caddy" version
      - name: Published DSH Web full-profile acceptance
        env:
          DSH_OIDC_CADDY_BIN: ${{ runner.temp }}/caddy
        run: npm run test:acceptance:full-profile
      - name: Reproduce separate web-oidc install and hidden bootstrap URL
        env:
          PYTHONOPTIMIZE: '1' # Release checks must survive python -O.
        run: npm run test:public-install
